<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111827" />
  <meta name="description" content="Sabeel Siddiqi's personal website. Coming soon." />
  <title>Sabeel Siddiqi — Coming Soon</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: #111827; color: #f9fafb; }
    header, footer { width: min(100% - 48px, 1050px); margin-inline: auto; }
    header { padding-top: 36px; font-size: 19px; font-weight: 700; letter-spacing: -.04em; }
    main { flex: 1; width: min(100% - 48px, 1050px); margin: auto; display: flex; flex-direction: column; justify-content: center; padding-block: 110px; }
    .eyebrow { color: #a5b4fc; text-transform: uppercase; letter-spacing: .16em; font-size: 12px; font-weight: 700; margin-bottom: 20px; }
    h1 { font-size: clamp(48px, 9vw, 92px); letter-spacing: -.065em; line-height: 1.05; margin: 0 0 25px; font-weight: 650; }
    p { font-size: clamp(17px, 2.3vw, 21px); color: #aab3c2; line-height: 1.65; max-width: 570px; margin: 0; }
    footer { padding-bottom: 34px; color: #778195; font-size: 13px; }
    @media (prefers-reduced-motion: no-preference) { main { animation: appear .6s ease-out both; } @keyframes appear { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } } }
  </style>
</head>
<body>
  <header>sabeel.io</header>
  <main>
    <div class="eyebrow">Personal website · Coming soon</div>
    <h1>Hi, I'm Sabeel.</h1>
    <p>Technologist, builder, and lifelong learner. I'm working on something new here. Check back soon.</p>
  </main>
  <footer>© 2026 Sabeel Siddiqi</footer>
</body>
</html>
